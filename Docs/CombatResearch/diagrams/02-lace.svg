troke-linejoin="round"/><path d="M 1421.0,1189 L 1421.0,1210" fill="none" stroke="#68736E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="784.0" y="1188" width="48.216" height="21" rx="3" fill="#B84243"/><rect x="1078.0" y="1188" width="48.216" height="21" rx="3" fill="#B84243"/><path d="M 714,1181 L 784.0,1181 L 784.0,1188" fill="none" stroke="#B84243" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1045,1181 L 1078.0,1181 L 1078.0,1188" fill="none" stroke="#B84243" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 833.0,1209 L 833.0,1225" fill="none" stroke="#477754" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1127.0,1209 L 1127.0,1225" fill="none" stroke="#477754" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 56,1312 L 1544,1312" fill="none" stroke="#D9DFD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="56" y="56.0">SILKSONG / COMBAT ATLAS</tspan></text><text fill="#22302D" font-size="48" font-weight="600" text-anchor="start"><tspan x="56" y="126.0">Lace 第一战｜读招、距离与反击</tspan></text><text fill="#68736E" font-size="26" font-weight="400" text-anchor="start"><tspan x="56" y="171.0">先选招，再调整距离；动画事件决定每一刀何时生效。</tspan></text><text fill="#187A75" font-size="48" font-weight="600" text-anchor="end"><tspan x="1544" y="86.0">02</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="end"><tspan x="1544" y="126.0">LACE BOSS1</tspan><tspan x="1544" y="154.0">HP 250 · Bone_East_12</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="82" y="218.0">状态 / 判断</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="312" y="218.0">前摇 / 预告</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="542" y="218.0">伤害窗口</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="772" y="218.0">收招 / 恢复</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="1002" y="218.0">独立控制器</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="1293" y="218.0">跨对象事件</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="300.0">A</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="305.0">选招：半血先查特殊技，再看距离</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="80" y="345.0">保留短路顺序；墙边、退场与演奏分支折叠。</tspan></text><text fill="#187A75" font-size="23" font-weight="600" text-anchor="middle"><tspan x="157.0" y="407.0">待机观察</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="middle"><tspan x="157.0" y="436.0">0.75 s / 受伤</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="middle"><tspan x="350" y="406.0">HP ≤ 125？</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="350" y="438.0">半血门槛</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="middle"><tspan x="589" y="406.0">计数 ≤ 0？</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="589" y="438.0">仅低血量检查</tspan></text><text fill="#775D9C" font-size="23" font-weight="600" text-anchor="middle"><tspan x="847.0" y="407.0">准备十字斩</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="middle"><tspan x="847.0" y="438.0">先调位置</tspan></text><text fill="#187A75" font-size="19" font-weight="500" text-anchor="middle"><tspan x="467" y="398.0">是</tspan></text><text fill="#775D9C" font-size="19" font-weight="500" text-anchor="middle"><tspan x="718" y="398.0">是</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="middle"><tspan x="230" y="583.0">距离 ≤ 6？</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="230" y="615.0">欧氏距离</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="88" y="495.0">否：计数不变</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="445" y="493.0">否：计数 −1</tspan></text><text fill="#187A75" font-size="23" font-weight="600" text-anchor="middle"><tspan x="487.5" y="586.0">近距候选</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="middle"><tspan x="487.5" y="617.0">后撤 / 连斩 / 冲刺</tspan></text><text fill="#187A75" font-size="22" font-weight="600" text-anchor="middle"><tspan x="802.5" y="585.0">远距选招 → 前跳</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="middle"><tspan x="802.5" y="617.0">先保存招式，再调整距离</tspan></text><text fill="#187A75" font-size="18" font-weight="500" text-anchor="middle"><tspan x="347" y="567.0">≤6</tspan></text><text fill="#187A75" font-size="19" font-weight="500" text-anchor="start"><tspan x="256" y="651.0">&gt;6</tspan></text><text fill="#477754" font-size="22" font-weight="600" text-anchor="middle"><tspan x="654.5" y="722.2">执行招式 → 收招 / 后续路由</tspan></text><text fill="#22302D" font-size="21" font-weight="600" text-anchor="start"><tspan x="88" y="707.0">先选，再接近</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="88" y="738.0">前跳不重新抽招</tspan></text><text fill="#775D9C" font-size="19" font-weight="500" text-anchor="middle"><tspan x="847" y="501.0">计数重设 2–4</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="1014" y="300.0">B</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="1057" y="305.0">反击：等玩家触发</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="1014" y="345.0">进入姿态 ≠ 已经释放反击连段。</tspan></text><text fill="#B37024" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1267" y="388.0">距离 &lt; 6 ＋ 已有反击标记</tspan></text><text fill="#22302D" font-size="23" font-weight="500" text-anchor="middle"><tspan x="1267" y="422.0">Counter Pause &gt; 0.25</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="middle"><tspan x="1267" y="451.0">缓动值门槛，不是 0.25 秒计时器</tspan></text><text fill="#B37024" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1267.0" y="524.9">反击姿态 · 0.75 s</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1267" y="610.0">BLOCKED HIT？</tspan></text><text fill="#B84243" font-size="19" font-weight="500" text-anchor="middle"><tspan x="1125" y="651.0">收到格挡事件</tspan></text><text fill="#477754" font-size="19" font-weight="500" text-anchor="middle"><tspan x="1410" y="651.0">0.75 s 到期</tspan></text><text fill="#B84243" font-size="22" font-weight="600" text-anchor="middle"><tspan x="1130.0" y="714.7">触发反击连段</tspan></text><text fill="#477754" font-size="22" font-weight="600" text-anchor="middle"><tspan x="1396.5" y="714.7">姿态自然收招</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="1267" y="759.0">方向性无敌；姿态退出自动恢复</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="835.0">C</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="840.0">冲刺：0.2 + 0.6 + 0.3 秒</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="80" y="880.0">先后撤、再停顿；0.8 秒时才打开 Charge Hit。</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="84" y="908.0">0.0 s</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="294" y="908.0">0.2 s</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="924" y="908.0">0.8 s</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="1239" y="908.0">1.1 s</tspan></text><text fill="#B37024" font-size="23" font-weight="600" text-anchor="middle"><tspan x="189.0" y="951.0">后撤 · 0.2 s</tspan></text><text fill="#B37024" font-size="23" font-weight="600" text-anchor="middle"><tspan x="609.0" y="951.0">停顿 · 0.6 s</tspan></text><text fill="#B84243" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1081.5" y="951.0">攻击 · 0.3 s</tspan></text><text fill="#477754" font-size="23" font-weight="600" text-anchor="middle"><tspan x="1388" y="951.0">动画收招</tspan></text><text fill="#22302D" font-size="18" font-weight="400" text-anchor="middle"><tspan x="189" y="986.0">初速 −32 · 逐步减速</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="middle"><tspan x="609" y="989.0">水平速度 = 0</tspan></text><text fill="#22302D" font-size="20" font-weight="400" text-anchor="middle"><tspan x="1081" y="988.0">初速 +80 · 逐步减速</tspan></text><text fill="#22302D" font-size="19" font-weight="400" text-anchor="middle"><tspan x="1388" y="987.0">等动画结束 · 退出刹车</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="84" y="1016.0">速度方向相对朝向；阻尼按物理步生效。</tspan></text><text fill="#B84243" font-size="18" font-weight="500" text-anchor="end"><tspan x="1518" y="1016.0">有效框仅在红色攻击段打开</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="1090.0">D</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="1095.0">连斩：四个动画事件，两个短刀窗</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="80" y="1135.0">Combo Slash · 28 帧 / 24 fps · 帧索引从 0 开始</tspan></text><text fill="#B84243" font-size="22" font-weight="600" text-anchor="middle"><tspan x="714" y="1175.0">帧 14 · 第一刀开</tspan></text><text fill="#B84243" font-size="22" font-weight="600" text-anchor="middle"><tspan x="1045" y="1175.0">帧 20 · 第二刀开</tspan></text><text fill="#477754" font-size="21" font-weight="600" text-anchor="middle"><tspan x="833.0" y="1246.0">帧 15 · 第一刀关</tspan></text><text fill="#477754" font-size="21" font-weight="600" text-anchor="middle"><tspan x="1127.0" y="1246.0">帧 21 · 第二刀关</tspan></text><text fill="#B37024" font-size="23" font-weight="500" text-anchor="middle"><tspan x="340" y="1183.0">起手 / 预告</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="98" y="1236.0">0</tspan></text><text fill="#477754" font-size="21" font-weight="500" text-anchor="end"><tspan x="1470" y="1246.0">动画完成</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="82" y="1280.0">每刀另设 0.041 s 自动关闭；状态退出也会关刀。</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="end"><tspan x="1518" y="1280.0">事件索引 ≠ 显示器帧数</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="56" y="1350.0">关键分支折叠图 · HP &gt; 125 不扣十字斩计数 · 远距先选招再前跳 · 非录像实测</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="56" y="1380.0">源：Bone_East_12 / Control · Lace Anim / Combo Slash · 本地战斗研究资料</tspan></text></svg>