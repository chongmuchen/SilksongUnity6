th d="M 641,996 L 659,996" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 649.0,991.0 L 659,996 L 649.0,1001.0" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="664" y="941" width="264" height="116" rx="14" fill="#FBE8E6"/><path d="M 931,996 L 949,996" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 939.0,991.0 L 949,996 L 939.0,1001.0" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="954" y="941" width="264" height="116" rx="14" fill="#EAF2E7"/><path d="M 1221,996 L 1239,996" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1229.0,991.0 L 1239,996 L 1229.0,1001.0" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1244" y="941" width="270" height="116" rx="14" fill="#EAF2E7"/><path d="M 92,1240 L 880,1240" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 92,1172 L 880,1172" fill="none" stroke="#D9DFD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><circle cx="215" cy="1118" r="25" fill="#E7F3F0" stroke="#187A75" stroke-width="3"/><path d="M 241,1118 C 300,1118 320,1172 390,1172 L 750,1172" fill="none" stroke="#B84243" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 750,1172 L 800,1172" fill="none" stroke="#B84243" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 790.0,1167.0 L 800,1172 L 790.0,1177.0" fill="none" stroke="#B84243" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 210,1146 L 210,1238" fill="none" stroke="#187A75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><path d="M 825,1172 L 825,1240" fill="none" stroke="#187A75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 816,1172 L 834,1172 M 816,1240 L 834,1240" fill="none" stroke="#187A75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="954" y="1090" width="560" height="165" rx="14" fill="#E7F3F0"/><path d="M 56,1312 L 1544,1312" fill="none" stroke="#D9DFD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="56" y="56.0">SILKSONG / COMBAT ATLAS</tspan></text><text fill="#22302D" font-size="48" font-weight="600" text-anchor="start"><tspan x="56" y="126.0">苔藓之母 · 血量驱动的选招树</tspan></text><text fill="#68736E" font-size="26" font-weight="400" text-anchor="start"><tspan x="56" y="171.0">从一个俯冲，逐步加入撞顶、落石与召唤。</tspan></text><text fill="#187A75" font-size="48" font-weight="600" text-anchor="end"><tspan x="1544" y="86.0">01</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="end"><tspan x="1544" y="126.0">Tut_03 / Mossbone Mother</tspan><tspan x="1544" y="154.0">HP 120 · Control 68 状态</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="82" y="218.0">状态 / 判断</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="312" y="218.0">前摇 / 预告</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="542" y="218.0">伤害窗口</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="772" y="218.0">收招 / 恢复</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="1002" y="218.0">独立控制器</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="1293" y="218.0">跨对象事件</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="300.0">A</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="305.0">在选招节点读取血量</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="80" y="345.0">血量改变候选池；当前攻击不会被血量门槛立刻打断。</tspan></text><text fill="#187A75" font-size="25" font-weight="600" text-anchor="start"><tspan x="107" y="427.0">移动待机</tspan></text><text fill="#22302D" font-size="20" font-weight="400" text-anchor="start"><tspan x="107" y="462.0">保持距离 12</tspan><tspan x="107" y="491.6">目标高度：玩家 +6</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="middle"><tspan x="435" y="432.0">HP &gt; 114？</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="middle"><tspan x="435" y="464.0">Move Choice</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="552" y="409.0">是</tspan></text><text fill="#B37024" font-size="25" font-weight="600" text-anchor="start"><tspan x="657" y="382.0">俯冲 Swoop</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="657" y="418.0">高血量时为唯一选项</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="450" y="538.0">否</tspan></text><text fill="#187A75" font-size="25" font-weight="600" text-anchor="start"><tspan x="337" y="598.0">抽取俯冲 / 撞顶</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="337" y="634.0">初始权重 1 : 1</tspan><tspan x="337" y="665.08">连续上限 2 / 1</tspan></text><text fill="#775D9C" font-size="25" font-weight="600" text-anchor="start"><tspan x="657" y="629.0">撞顶 → 选择掉落物</tspan></text><text fill="#22302D" font-size="20" font-weight="400" text-anchor="start"><tspan x="657" y="664.0">先撞屋顶，再进 Drop Type</tspan><tspan x="657" y="693.6">落石 / 爬虫取决于 HP</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="85" y="745.0">出招结束 → 收招 → 待机（召唤期间使用另一条待机分支）</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="85" y="782.0">随机选择器带历史记忆；权重不等于每次最终概率。</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="1024" y="300.0">B</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="1067" y="305.0">三段血量，两个检查点</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="1024" y="345.0">初始生命：120</tspan></text><text fill="#187A75" font-size="25" font-weight="600" text-anchor="start"><tspan x="1048" y="400.0">115–120 HP</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="1048" y="436.0">Move Choice：强制俯冲</tspan></text><text fill="#B37024" font-size="25" font-weight="600" text-anchor="start"><tspan x="1048" y="526.0">85–114 HP</tspan></text><text fill="#22302D" font-size="20" font-weight="400" text-anchor="start"><tspan x="1048" y="561.0">撞顶加入候选；撞顶后只触发落石</tspan></text><text fill="#775D9C" font-size="25" font-weight="600" text-anchor="start"><tspan x="1048" y="652.0">0–84 HP¹</tspan></text><text fill="#22302D" font-size="20" font-weight="400" text-anchor="start"><tspan x="1048" y="687.0">撞顶后：落石 / 召唤爬虫，权重 1 : 1</tspan><tspan x="1048" y="716.6">两种掉落最多各连续选择 1 次</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="1026" y="769.0">¹ HP = 0 的全局死亡优先，不再正常选招。</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="875.0">C</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="880.0">俯冲拆成五段：固定等待 + 条件退出</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="80" y="920.0">此时间轴按阶段排版，不按时长比例；下方轨迹仅示意。</tspan></text><text fill="#B37024" font-size="23" font-weight="600" text-anchor="start"><tspan x="101" y="974.0">前摇</tspan></text><text fill="#22302D" font-size="28" font-weight="600" text-anchor="start"><tspan x="101" y="1012.0">0.40 s</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="101" y="1043.0">速度每步 ×0.75</tspan></text><text fill="#B84243" font-size="23" font-weight="600" text-anchor="start"><tspan x="391" y="974.0">俯冲</tspan></text><text fill="#22302D" font-size="28" font-weight="600" text-anchor="start"><tspan x="391" y="1012.0">0.90 s</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="391" y="1043.0">高度缓动 0.50 s</tspan></text><text fill="#B84243" font-size="23" font-weight="600" text-anchor="start"><tspan x="681" y="974.0">延伸</tspan></text><text fill="#22302D" font-size="28" font-weight="600" text-anchor="start"><tspan x="681" y="1012.0">时长可变</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="681" y="1043.0">越界 或 横距 &gt;2</tspan></text><text fill="#477754" font-size="23" font-weight="600" text-anchor="start"><tspan x="971" y="974.0">折返</tspan></text><text fill="#22302D" font-size="28" font-weight="600" text-anchor="start"><tspan x="971" y="1012.0">0.50 s</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="971" y="1043.0">水平速度每步 ×0.95</tspan></text><text fill="#477754" font-size="23" font-weight="600" text-anchor="start"><tspan x="1261" y="974.0">收招</tspan></text><text fill="#22302D" font-size="28" font-weight="600" text-anchor="start"><tspan x="1261" y="1012.0">0.65 s</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="1261" y="1043.0">受伤可提前结束</tspan></text><text fill="#68736E" font-size="17" font-weight="400" text-anchor="start"><tspan x="94" y="1265.0">地面</tspan></text><text fill="#187A75" font-size="20" font-weight="400" text-anchor="start"><tspan x="550" y="1213.0">采样地面 + 2.2</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="172" y="1092.0">Boss</tspan></text><text fill="#22302D" font-size="22" font-weight="600" text-anchor="start"><tspan x="340" y="1112.0">进入俯冲时只采样一次地面高度</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="340" y="1145.0">玩家随后移动，不会让已采样高度重新跟随。</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="start"><tspan x="974" y="1128.0">移动与伤害是两套逻辑</tspan></text><text fill="#22302D" font-size="20" font-weight="400" text-anchor="start"><tspan x="974" y="1165">俯冲目标 vx = 18 × scaleX；先反向蓄势。</tspan><tspan x="974" y="1196">红色表示俯冲威胁段，身体接触伤害为 1；</tspan><tspan x="974" y="1227">不能据此推断其他阶段完全没有接触伤害。</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="56" y="1350.0">关键战斗分支折叠图 · 静态源数据核对 · 非运行录像实测</tspan></text><text fill="#68736E" font-size="17" font-weight="400" text-anchor="start"><tspan x="56" y="1379.0">依据：Tut_03.unity · Control / Move Choice / Swoop / Drop Type；完整参数见 CombatResearch 双文档。</tspan></text></svg>