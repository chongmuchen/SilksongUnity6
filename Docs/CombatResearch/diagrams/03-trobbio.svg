36E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 107.0,880.0 L 102,890 L 97.0,880.0" fill="none" stroke="#68736E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 344,948 L 371,948 L 371,866 L 862,866 L 862,890" fill="none" stroke="#775D9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><path d="M 867.0,880.0 L 862,890 L 857.0,880.0" fill="none" stroke="#775D9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 716,1150 L 690,1150 L 690,1057 L 212,1057 L 212,1120" fill="none" stroke="#775D9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><path d="M 217.0,1110.0 L 212,1120 L 207.0,1110.0" fill="none" stroke="#775D9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="525" y="857" width="10" height="18" rx="0" fill="#FFFFFF"/><path d="M 530,850 L 530,881" fill="none" stroke="#775D9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="525" y="1048" width="10" height="18" rx="0" fill="#FFFFFF"/><path d="M 530,1040 L 530,1073" fill="none" stroke="#775D9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1060" y="530" width="484" height="355" rx="22" fill="#FFFFFF" stroke="#D9DFD6" stroke-width="2"/><rect x="1084" y="636" width="436" height="58" rx="12" fill="#E7F3F0"/><rect x="1098" y="756" width="408" height="48" rx="5" fill="#F5F3ED" stroke="#D9DFD6" stroke-width="2"/><rect x="1190" y="756" width="224" height="48" rx="0" fill="#EAF2E7" stroke="#477754" stroke-width="2"/><path d="M 1190,806 L 1190,817 M 1414,806 L 1414,817" fill="none" stroke="#68736E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="1060" y="910" width="484" height="375" rx="22" fill="#FFFFFF" stroke="#D9DFD6" stroke-width="2"/><rect x="1098" y="1025" width="408" height="180" rx="5" fill="#F5F3ED" stroke="#D9DFD6" stroke-width="2"/><rect x="1190" y="1049" width="252" height="119" rx="0" fill="#FBF0DC" stroke="#B37024" stroke-width="2"/><path d="M 1179,1049 L 1190,1049 M 1179,1168 L 1190,1168 M 1190,1168 L 1190,1179 M 1442,1168 L 1442,1179" fill="none" stroke="#68736E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 56,1312 L 1544,1312" fill="none" stroke="#D9DFD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="56" y="56.0">SILKSONG / COMBAT ATLAS</tspan></text><text fill="#22302D" font-size="48" font-weight="600" text-anchor="start"><tspan x="56" y="126.0">Trobbio｜三个控制器的协作</tspan></text><text fill="#68736E" font-size="26" font-weight="400" text-anchor="start"><tspan x="56" y="171.0">主控继续选招，炸弹独立飞行；舞台通过事件回报最后爆点</tspan></text><text fill="#187A75" font-size="48" font-weight="600" text-anchor="end"><tspan x="1544" y="86.0">03</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="end"><tspan x="1544" y="126.0">Library_13</tspan><tspan x="1544" y="154.0">700 HP · 主 FSM 144 状态</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="82" y="218.0">状态 / 判断</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="312" y="218.0">前摇 / 预告</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="542" y="218.0">伤害窗口</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="772" y="218.0">收招 / 恢复</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="1002" y="218.0">独立控制器</tspan></text><text fill="#68736E" font-size="20" font-weight="400" text-anchor="start"><tspan x="1293" y="218.0">跨对象事件</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="300.0">A</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="305.0">选招有记忆，阶段检查有顺序</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="start"><tspan x="102" y="367.0">首次：仅 3 招</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="102" y="404.0">旋风 / 投弹 / 跳跃</tspan><tspan x="102" y="435.08">权重 1 / 1 / 1</tspan><tspan x="102" y="466.15999999999997">先于阶段检查</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="start"><tspan x="410" y="367.0">P1：五项候选</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="410" y="404.0">旋风 / 投弹 / 闪光</tspan><tspan x="410" y="435.08">跳跃 / 退场</tspan><tspan x="410" y="466.15999999999997">前四项权重 1；退场 0.75</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="start"><tspan x="764" y="367.0">P2：退场项换成爆柱</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="764" y="404.0">旋风 / 投弹 / 闪光</tspan><tspan x="764" y="435.08">跳跃 / 爆柱</tspan><tspan x="764" y="466.15999999999997">五项权重均为 1</tspan></text><text fill="#B37024" font-size="24" font-weight="600" text-anchor="start"><tspan x="1118" y="367.0">HP &lt; 350 且尚未 P2</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="1118" y="404.0">下次 Choice → 吼叫 1.5 秒</tspan><tspan x="1118" y="435.08">→ 退场／爆柱支路</tspan><tspan x="1118" y="466.15999999999997">350 不切换；当前招式不中断</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="80" y="570.0">B</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="123" y="575.0">一次投弹与一次爆柱：跨对象如何接力</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="80" y="615.0">每个选择器独立记忆；投弹、空中再选招可再次使用同类招式。</tspan></text><text fill="#187A75" font-size="22" font-weight="600" text-anchor="middle"><tspan x="212.0" y="661.0">Boss 主控</tspan></text><text fill="#775D9C" font-size="22" font-weight="600" text-anchor="middle"><tspan x="530.0" y="661.0">炸弹 ×3</tspan></text><text fill="#775D9C" font-size="22" font-weight="600" text-anchor="middle"><tspan x="862.0" y="661.0">舞台控制</tspan></text><text fill="#B37024" font-size="24" font-weight="600" text-anchor="start"><tspan x="102" y="729.0">投弹 Throw</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="102" y="766.0">帧 6：约 0.5 秒生成</tspan><tspan x="102" y="797.08">动画结束，主控继续</tspan></text><text fill="#775D9C" font-size="24" font-weight="600" text-anchor="start"><tspan x="420" y="729.0">3 颗独立炸弹</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="420" y="766.0">vx：+15 / −15 / ±3</tspan><tspan x="420" y="797.08">角度：0° / 90° / 180°</tspan></text><text fill="#775D9C" font-size="22" font-weight="600" text-anchor="start"><tspan x="748" y="740.0">异步控制器</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="748" y="774">收到请求才启动</tspan><tspan x="748" y="805">有自己的状态与计时</tspan></text><text fill="#187A75" font-size="24" font-weight="600" text-anchor="start"><tspan x="102" y="931.0">BC Attack</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="102" y="968.0">发送 ATTACK</tspan><tspan x="102" y="999.08">等待 FINAL BURST</tspan></text><text fill="#775D9C" font-size="23" font-weight="600" text-anchor="start"><tspan x="420" y="930.0">Air：飞行 / 反弹</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="420" y="968.0">Timer 初值 1–1.7 秒</tspan><tspan x="420" y="999.08">普通引爆：见右图</tspan></text><text fill="#775D9C" font-size="24" font-weight="600" text-anchor="start"><tspan x="738" y="931.0">Trapdoor Bursts</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="738" y="968.0">选择出口列与爆柱模式</tspan><tspan x="738" y="999.08">触发各列</tspan></text><text fill="#477754" font-size="23" font-weight="600" text-anchor="start"><tspan x="102" y="1160.0">确定最后爆点</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="102" y="1198.0">接收 Final Burst 对象</tspan><tspan x="102" y="1229.08">→ 重新入场</tspan></text><text fill="#B84243" font-size="24" font-weight="600" text-anchor="start"><tspan x="420" y="1161.0">Antic → Explode</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="420" y="1198.0">前摇 0.75 秒，可提前</tspan><tspan x="420" y="1229.08">开 Blast；2 秒后回池</tspan></text><text fill="#775D9C" font-size="24" font-weight="600" text-anchor="start"><tspan x="738" y="1131.0">等待 1.25 秒</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="738" y="1168.0">写回 Final Burst 对象</tspan><tspan x="738" y="1199.08">发送 FINAL BURST</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="738" y="1245.0">舞台再等 2 秒 → Idle</tspan></text><text fill="#775D9C" font-size="18" font-weight="600" text-anchor="middle"><tspan x="371" y="743.0">生成</tspan></text><text fill="#775D9C" font-size="18" font-weight="400" text-anchor="start"><tspan x="410" y="856.0">各自运行</tspan></text><text fill="#775D9C" font-size="18" font-weight="400" text-anchor="start"><tspan x="542" y="1090.0">条件满足</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="118" y="853.0">后续可选爆柱支路</tspan></text><text fill="#775D9C" font-size="22" font-weight="600" text-anchor="start"><tspan x="709" y="854.0">ATTACK</tspan></text><text fill="#775D9C" font-size="21" font-weight="600" text-anchor="start"><tspan x="275" y="1044.0">FINAL BURST</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="80" y="1275.0">收招 / 选招已折叠；2 秒为回收等待，非伤害窗；虚线交叉不连接。</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="1084" y="570.0">C</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="1127" y="575.0">旋风：时间 AND 位置</tspan></text><text fill="#68736E" font-size="22" font-weight="400" text-anchor="start"><tspan x="1084" y="616.0">Timer 从 1.6 秒递减</tspan></text><text fill="#187A75" font-size="22" font-weight="600" text-anchor="middle"><tspan x="1302" y="673.0">Timer &lt; 0  AND  x ∈ [66,82]</tspan></text><text fill="#22302D" font-size="22" font-weight="400" text-anchor="start"><tspan x="1084" y="729.0">都满足才收招，否则继续旋风</tspan></text><text fill="#477754" font-size="22" font-weight="600" text-anchor="middle"><tspan x="1302" y="787.0">可收招区域</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="middle"><tspan x="1190" y="838.0">66</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="middle"><tspan x="1414" y="838.0">82</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="1084" y="872.0">世界 x 坐标 · 示意非比例</tspan></text><text fill="#187A75" font-size="20" font-weight="600" text-anchor="start"><tspan x="1084" y="950.0">D</tspan></text><text fill="#22302D" font-size="29" font-weight="600" text-anchor="start"><tspan x="1127" y="955.0">炸弹：普通引爆门槛</tspan></text><text fill="#68736E" font-size="22" font-weight="400" text-anchor="start"><tspan x="1084" y="996.0">Timer &lt; 0  AND  位于矩形内</tspan></text><text fill="#B37024" font-size="22" font-weight="600" text-anchor="middle"><tspan x="1316" y="1114.0">普通引爆区域</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="end"><tspan x="1167" y="1055.0">22.5</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="end"><tspan x="1167" y="1174.0">15.5</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="middle"><tspan x="1190" y="1200.0">62</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="middle"><tspan x="1442" y="1200.0">86</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="1113" y="1108.0">y</tspan></text><text fill="#68736E" font-size="21" font-weight="400" text-anchor="start"><tspan x="1475" y="1200.0">x</tspan></text><text fill="#22302D" font-size="21" font-weight="400" text-anchor="start"><tspan x="1084" y="1239.0">区外继续飞行；区内进入 0.75 秒前摇</tspan></text><text fill="#68736E" font-size="18" font-weight="400" text-anchor="start"><tspan x="1084" y="1273.0">世界坐标 · 示意非比例 · 特殊命中可提前引爆</tspan></text><text fill="#68736E" font-size="19" font-weight="400" text-anchor="start"><tspan x="56" y="1350.0">STUN / ZERO HP 中断攻击并清理伤害框与事件器 · 图中时间为游戏时间 · 动画帧从 0 起</tspan></text><text fill="#68736E" font-size="17" font-weight="400" text-anchor="start"><tspan x="56" y="1379.0">来源：Library_13 / Trobbio、Trobbio Bomb · bosses-ai.md TR / bosses-human.md Trobbio</tspan></text></svg>